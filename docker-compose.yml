services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USE_GPU: "true"
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./test:/test:ro
      - video_uploads:/app/uploads
      - job_data:/app/jobs
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  video_uploads:
  job_data:
